<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- =============================================================
       REDIRECIONAMENTO — página renomeada
       =============================================================
       "Mapa do Medo" virou "Goiás Seguro para Todos" e o arquivo passou a ser
       goias-seguro-para-todos.html. Este arquivo fica no lugar do antigo
       porque o endereço /mapa-do-medo.html já circulou em WhatsApp, panfletos
       e resultados de busca — apagá-lo daria 404 para quem clicar.

       O GitHub Pages não faz redirecionamento de servidor (não há 301), então
       o desvio é feito no próprio HTML, em três camadas:
         1. <link rel="canonical">  → diz ao Google qual é o endereço válido;
         2. <meta http-equiv="refresh" content="0"> → desvia sem JavaScript;
         3. location.replace()      → desvia antes de pintar a tela e preserva
                                      ?query e #âncora, além de não deixar
                                      entrada no histórico (o "voltar" não
                                      cai de novo aqui).
       O link visível abaixo é a saída para quem tiver script e refresh
       bloqueados — exigência do eMAG/WCAG 2.2.1.

       Pode ser removido quando os buscadores já tiverem reindexado o novo
       endereço e o antigo não aparecer mais em nenhum material de campanha.
       ============================================================= -->
  <link rel="canonical" href="https://delegadoyasser.com.br/goias-seguro-para-todos.html">
  <meta http-equiv="refresh" content="0; url=goias-seguro-para-todos.html">
  <script>
    (function () {
      var destino = "goias-seguro-para-todos.html" + window.location.search + window.location.hash;
      window.location.replace(destino);
    })();
  </script>

  <title>Página movida — Goiás Seguro para Todos | Delegado Yasser</title>
  <meta name="description" content="O Mapa do Medo agora se chama Goiás Seguro para Todos. Você está sendo levado para a nova página.">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fcf9f5;
      color: #1c1a19;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    main { max-width: 34rem; }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 0.75rem; }
    p { margin: 0 0 1.25rem; }
    a.btn {
      display: inline-block;
      padding: 14px 26px;
      min-height: 44px;
      box-sizing: border-box;
      border-radius: 10px;
      background: #f9120c;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a.btn:hover, a.btn:focus-visible { background: #c60d08; }
    a.btn:focus-visible { outline: 3px solid #1c1a19; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Esta página mudou de nome</h1>
    <p>O <strong>Mapa do Medo</strong> agora se chama <strong>Goiás Seguro para Todos</strong>.
       Estamos levando você para lá.</p>
    <p><a class="btn" href="goias-seguro-para-todos.html">Ir para Goiás Seguro para Todos</a></p>
  </main>
</body>
</html>
